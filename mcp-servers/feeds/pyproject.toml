[project]
name = "feeds-mcp"
version = "0.1.0"
description = "RSS 구독과 최근 항목 조회 MCP 서버"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
feeds-mcp = "feeds.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feeds"]
