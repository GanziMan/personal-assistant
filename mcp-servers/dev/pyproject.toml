[project]
name = "dev-mcp"
version = "0.1.0"
description = "레포 탐색·git 상태 조회 MCP 서버 (읽기 전용)"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[project.scripts]
dev-mcp = "dev_tools.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_tools"]
