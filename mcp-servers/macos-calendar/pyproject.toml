[project]
name = "macos-calendar-mcp"
version = "0.1.0"
description = "EventKit 기반 캘린더·리마인더 MCP 서버"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pyobjc-framework-EventKit>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
macos-calendar-mcp = "macos_calendar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_calendar"]
