[project]
name = "macos-files-mcp"
version = "0.1.0"
description = "허용된 폴더 안에서만 동작하는 파일 MCP 서버"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3"]

[project.scripts]
macos-files-mcp = "macos_files.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_files"]
