[project]
name = "memory-mcp"
version = "0.1.0"
description = "비서 기억 열람 MCP 서버"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3", "assistant-core"]

[project.scripts]
memory-mcp = "memory_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_mcp"]
