[project]
name = "docsearch-mcp"
version = "0.1.0"
description = "로컬 문서 의미 검색 MCP 서버"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1", "assistant-core", "macos-files-mcp"]

[project.scripts]
docsearch-mcp = "docsearch.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsearch"]
