[project]
name = "jobs-mcp"
version = "0.1.0"
description = "채용공고 수집 MCP 서버 (사람인 공식 API)"
requires-python = ">=3.12"
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
jobs-mcp = "jobs.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobs"]
